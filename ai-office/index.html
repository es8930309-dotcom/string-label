<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的 AI 辦公室</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: 等角俯視的辦公室模型佔滿上半部，可拖曳縮放；下方是成員名冊（每位成員＝一段對話）。 */
:root{
  --bg:#f3ede4; --card:#fffcf7; --ink:#2e2621; --muted:#7b6a5b; --line:#e4d8c7;
  --brass:#b38a45; --walnut:#6b4a33; --chip:#2e2621; --chip-ink:#fff;
  --ok:#7f9d5e; --wait:#d9962f; --busy:#c79a3f;
  --stage:#efe6d8;
  --display:"Noto Serif TC", "Songti TC", serif;
  --body:"Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1e1915; --card:#29221d; --ink:#f1e7da; --muted:#b5a391; --line:#3e342c;
  --brass:#d4ae68; --walnut:#c79b74; --chip:#f1e7da; --chip-ink:#2e2621;
  --ok:#9dbb7a; --wait:#e8ac4b; --busy:#d9b062; --stage:#2b241e; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1e1915; --card:#29221d; --ink:#f1e7da; --muted:#b5a391; --line:#3e342c;
  --brass:#d4ae68; --walnut:#c79b74; --chip:#f1e7da; --chip-ink:#2e2621;
  --ok:#9dbb7a; --wait:#e8ac4b; --busy:#d9b062; --stage:#2b241e; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{font-family:var(--display);font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:.04em;text-wrap:balance}
.sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.stage{position:relative;border-radius:18px;overflow:hidden;background:var(--stage);
  border:1px solid var(--line);aspect-ratio:61/50;max-width:100%;max-height:82vh;width:100%;touch-action:none;
  box-shadow:0 18px 40px -28px rgba(70,45,20,.55)}
.stage svg{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
.stage svg.drag{cursor:grabbing}
.ctrl{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.ctrl button{width:38px;height:38px;border-radius:12px;border:1px solid rgba(80,55,30,.18);
  background:rgba(255,252,246,.92);color:#2e2621;font:600 18px/1 var(--body);cursor:pointer}
.ctrl button.wide{width:auto;padding:0 12px;font-size:13px}
.ctrl button:focus-visible,.member:focus-visible,.close:focus-visible,.open:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.hint{position:absolute;left:12px;bottom:14px;font-size:12px;color:#7b6a5b;background:rgba(255,252,246,.85);
  padding:4px 10px;border-radius:999px}
/* svg interactive bits */
.pp,.tag{cursor:pointer}
.pp.sel{filter:drop-shadow(0 0 3px #f2c86b) drop-shadow(0 0 6px #f2c86b)}
.tag.sel rect{fill:#8a6233}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.td{animation:td 1.2s ease-in-out infinite}
.td:nth-child(3){animation-delay:.2s}.td:nth-child(4){animation-delay:.4s}
@keyframes td{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-2px)}}
.led{animation:led 2.4s steps(2) infinite}
.led:nth-child(3n){animation-delay:.7s}.led:nth-child(4n){animation-delay:1.3s}
@keyframes led{50%{opacity:.25}}
.steam{animation:steam 3s ease-in-out infinite;opacity:0}
.steam:nth-child(2){animation-delay:1.4s}
@keyframes steam{0%{opacity:0;transform:translateY(0)}40%{opacity:.6}100%{opacity:0;transform:translateY(-9px)}}
@media (prefers-reduced-motion: reduce){.pulse,.td,.led,.steam{animation:none}.steam{opacity:.4}}
/* roster */
h2{font-family:var(--display);font-size:20px;margin:6px 0 0;letter-spacing:.04em}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.member{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;min-width:0}
.member:hover{border-color:var(--brass)}
.member.sel{border-color:var(--brass);box-shadow:0 0 0 2px color-mix(in srgb,var(--brass) 35%,transparent)}
.av{width:46px;height:46px;border-radius:12px;background:#efe3cf;grid-row:span 3;display:grid;place-items:center;overflow:hidden}
.av svg{width:46px;height:46px}
.dept{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.chip{background:var(--chip);color:var(--chip-ink);font-size:12px;padding:1px 10px;border-radius:999px;letter-spacing:.06em}
.st{font-size:12px;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.mt{font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere}
.ms{font-size:13px;color:var(--muted);min-width:0;overflow-wrap:anywhere;grid-column:2}
/* detail sheet */
.sheet{position:fixed;z-index:20;right:max(18px, calc(env(safe-area-inset-right, 0px) + 18px));bottom:max(18px, calc(env(safe-area-inset-bottom, 0px) + 18px));
  width:min(360px, calc(100vw - 32px));background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:18px;padding:18px;box-shadow:0 24px 60px -20px rgba(40,25,10,.45);display:grid;gap:10px}
.sheet .top{display:flex;gap:12px;align-items:center}
.sheet .av{grid-row:auto;width:58px;height:58px}.sheet .av svg{width:58px;height:58px}
.sheet h3{margin:0;font-size:18px;font-family:var(--display);overflow-wrap:anywhere}
.sheet p{margin:0;font-size:14px}
.meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.open{display:inline-flex;justify-self:start;align-items:center;gap:6px;background:var(--chip);color:var(--chip-ink);
  text-decoration:none;font-size:14px;padding:8px 14px;border-radius:999px}
.note{font-size:12.5px;color:var(--muted);margin:0}
@media (max-width:640px){
  .stage{aspect-ratio:auto;height:68vh}
  .sheet{left:max(16px, env(safe-area-inset-left, 0px));right:max(16px, env(safe-area-inset-right, 0px));width:auto;bottom:max(12px, env(safe-area-inset-bottom, 0px))}
  .hint{display:none}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>我的 AI 辦公室</h1>
      <p class="sub">每位同事都是你的一段對話。點小人或名牌，看看他們最近在忙什麼。</p>
    </div>
    <div class="legend" aria-label="狀態說明">
      <span><i class="dot" style="background:var(--ok)"></i>已完成</span>
      <span><i class="dot" style="background:var(--wait)"></i>等你回覆</span>
      <span><i class="dot" style="background:var(--busy)"></i>進行中</span>
      <span>★ 已釘選</span>
    </div>
  </header>

  <div class="stage" id="stage">
    <svg id="scene" role="img" aria-label="等角俯視的 AI 辦公室：上方中央是主管辦公室，左右各四個部門，中央圓形平台上有旋轉的線框方塊，下方是會議室、休息區與茶水間"></svg>
    <div class="hint">拖曳移動・滾輪或雙指縮放</div>
    <div class="ctrl">
      <button type="button" id="zin" aria-label="放大">＋</button>
      <button type="button" id="zout" aria-label="縮小">－</button>
      <button type="button" id="zreset" class="wide">全景</button>
    </div>
  </div>

  <h2>成員名冊</h2>
  <div class="roster" id="roster"></div>
  <p class="note">名冊依 2026/11/06 的對話清單建立。之後有新對話，跟我說一聲就幫你安排新座位。</p>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-labelledby="sh-title">
  <button type="button" class="close" id="sh-close" aria-label="關閉">×</button>
  <div class="top"><div class="av" id="sh-av"></div><div><div class="dept" id="sh-dept"></div><h3 id="sh-title"></h3></div></div>
  <p id="sh-sum"></p>
  <div class="meta" id="sh-meta"></div>
  <a class="open" id="sh-link" target="_blank" rel="noopener">開啟這段對話 ↗</a>
</div>

<script>
(()=>{
/* ───────── 成員資料（每位＝一段對話） ───────── */
const ST={done:{t:'已完成',c:'#86a865'},blocked:{t:'等你回覆',c:'#e3a13b'},working:{t:'進行中',c:'#e2b24f'}};
const MEMBERS=[
 {id:'m1',dept:'研究部',item:'research',name:'書籍閱讀',title:'書籍閱讀理解',status:'done',updated:'11/05 14:54',pin:0,
  sum:'把《穿線師年鑑》整理成技能包 stringer-yearbook：重點筆記、全書原文，還有羽球小學堂的系列規劃。',
  sid:'session_01NqhGXAmsKh9rNg3yeAafz1',shirt:'#8c6a4f',hair:'#3b2a20',style:'long',acc:'glasses',rug:'#e8d6bd'},
 {id:'m2',dept:'財務部',item:'finance',name:'航運AI股',title:'航運和 AI 產業股市分析',status:'blocked',updated:'11/04 16:31',pin:0,
  sum:'每天的股市分析有幾個資料來源連不上。在等你決定：改查證交所、鉅亨網等來源，或放寬網路限制。',
  sid:'session_01NqhGX9WFwPKUQUQMMyxg1y',shirt:'#4f5a48',hair:'#2a211c',style:'short',acc:'tie',rug:'#e3d7c2'},
 {id:'m3',dept:'品管部',item:'qc',name:'標籤機APP',title:'標籤機 APP',status:'done',updated:'11/06 20:18',pin:1,
  sum:'標籤的線種與磅數改成同一行並已上線；試算表加了通知取拍選單，貼上新程式並重新部署後生效。',
  sid:'session_01NqhGX9jkJB9tykADxZwrxn',shirt:'#c9774f',hair:'#4a3326',style:'bun',acc:'',rug:'#eadcc6'},
 {id:'m4',dept:'數據部',item:'data',name:'試算表連動',title:'Google 試算表連動應用',status:'done',updated:'11/06 11:53',pin:1,
  sum:'名字後面接數字會自動歸到本人（好炒1~4 → 好炒×4）。安裝頁已更新，要重貼 Index.html 並部署新版本。',
  sid:'session_01NqhGX7dP1hfyBLpLfhr6F3',shirt:'#7d8f5a',hair:'#30241d',style:'short2',acc:'',rug:'#e4dac4'},
 {id:'m5',dept:'設計部',item:'design',name:'AI辦公室',title:'AI 辦公室設計',status:'working',updated:'11/06 進行中',pin:0,
  sum:'就是現在這段對話。正在把你的每段對話安排進這間木質調辦公室。',
  sid:'session_01NqhGX9w5g1PZRWZLVX42bE',shirt:'#d9a441',hair:'#5a3a26',style:'pony',acc:'',rug:'#ecdcc0'},
 {id:'m6',dept:'翻譯部',item:'translate',name:'卡帶中文化',title:'Nintendo 卡帶遊戲日文改繁體中文',status:'done',updated:'11/04 15:04',pin:0,
  sum:'對話框改成 16×16 大字並打包給你試玩。戰鬥畫面還沒測，全劇情翻譯等你確認後開始。',
  sid:'session_01NqhGX8iydpfdwfUngcTHgd',shirt:'#b56b6b',hair:'#2b201a',style:'long',acc:'',rug:'#ead8c8'},
 {id:'m7',dept:'社群部',item:'social',name:'社群連結',title:'社群連結整理程式',status:'done',updated:'11/03 19:06',pin:0,
  sum:'收藏只存在你自己的裝置、不會上傳；PR #1 沒有衝突，可以直接合併。',
  sid:'session_01NqhGX8pfSJat2PerEFwqZx',shirt:'#a0785a',hair:'#3f2c22',style:'bun',acc:'',rug:'#e6d8c3'},
 {id:'m8',dept:'資訊部',item:'it',name:'雲端同步',title:'雲端對話同步',status:'done',updated:'10/31 13:07',pin:0,
  sum:'這台電腦已開啟 Remote Control，電腦開著時可以用手機上的 Claude App 接著聊。',
  sid:'session_01NqhGXACGjPoPvS2zoSkGh5',shirt:'#6f6a5e',hair:'#211a16',style:'short',acc:'headset',rug:'#e2d8c8'},
];
const BOSS={id:'boss',dept:'主管辦公室',name:'我',title:'你（老闆）',status:'done',updated:'',pin:0,
  sum:'整間辦公室的主人。每個部門都是你開過的一段對話，有事就找他們。',sid:'',shirt:'#3b3330',hair:'#2a201b',style:'short',acc:'tie',boss:1};
const ALL=[BOSS,...MEMBERS];
const byId=Object.fromEntries(ALL.map(m=>[m.id,m]));

/* ───────── 投影 ───────── */
const S=20, TH=30*Math.PI/180, EL=50*Math.PI/180;
const cT=Math.cos(TH), sT=Math.sin(TH), sE=Math.sin(EL), cE=Math.cos(EL);
const P=(x,y,z=0)=>[(x*cT-y*sT)*S, ((x*sT+y*cT)*sE - z*cE)*S];
const f=n=>Math.round(n*10)/10;
const pts=a=>a.map(p=>f(p[0])+','+f(p[1])).join(' ');
const poly=(a,fill,ex='')=>`<polygon points="${pts(a)}" fill="${fill}" ${ex}/>`;
const line=(a,b,st,w=.6,ex='')=>`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="${st}" stroke-width="${w}" ${ex}/>`;
function shade(hex,k){const n=parseInt(hex.slice(1),16);const r=n>>16,g=n>>8&255,b=n&255;
  const m=v=>Math.max(0,Math.min(255,Math.round(k>=1?v+(255-v)*(k-1):v*k)));
  return '#'+((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1);}
let seed=7;const rnd=()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};

/* 色票 */
const C={wall:'#f4eee4',oak:'#e4cb9f',oakL:'#ecd7b2',wal:'#76523a',wal2:'#8a6447',brass:'#c9a45c',brassD:'#a7823f',
  black:'#2c2a29',cream:'#f6f0e6',stone:'#dcd5ca',green:'#6f8a5b',orange:'#dc8a4c',city:'#c4c1bb'};

let main=[], city=[], floorDeco='', shadows='', rugs='', overlay='', tags=[];
function box(o,list=main){
  const {x,y,z=0,w,d,h,c}=o, x2=x+w,y2=y+d,z2=z+h;
  const top=[P(x,y,z2),P(x2,y,z2),P(x2,y2,z2),P(x,y2,z2)];
  const fr=[P(x,y2,z),P(x2,y2,z),P(x2,y2,z2),P(x,y2,z2)];
  const rt=[P(x2,y,z),P(x2,y2,z),P(x2,y2,z2),P(x2,y,z2)];
  const ex=`stroke="${o.st||'rgba(70,45,25,.2)'}" stroke-width="${o.sw||.6}" stroke-linejoin="round"${o.op!=null?` fill-opacity="${o.op}"`:''}`;
  let s=poly(fr,o.cf||shade(c,.9),ex)+poly(rt,o.cr||shade(c,.76),ex)+poly(top,o.ct||c,ex);
  if(o.deco) s+=o.deco({F:(u,v)=>P(x+u,y2,z+v),R:(u,v)=>P(x2,y+u,z+v),T:(u,v)=>P(x+u,y+v,z2),w,d,h});
  if(o.sh&&z<.05) addShadow(x,y,w,d,h);
  const it={bb:[x,y,z,x2,y2,z2],svg:s}; list.push(it); return it;
}
function addShadow(x,y,w,d,h){const k=Math.min(h,3),dx=k*.38,dy=k*.2;
  shadows+=poly([P(x,y),P(x+w,y),P(x+w+dx,y+dy),P(x+w+dx,y+d+dy),P(x+dx,y+d+dy),P(x,y+d)],'#4a3018');}
function ellipseAt(cx,cy,z,r,fill,ex=''){const [a,b]=P(cx,cy,z);return `<ellipse cx="${f(a)}" cy="${f(b)}" rx="${f(r*S)}" ry="${f(r*S*sE)}" fill="${fill}" ${ex}/>`;}
function cylSvg(o){const {cx,cy,r,z=0,h,c}=o;const [bx,by]=P(cx,cy,z),[tx,ty]=P(cx,cy,z+h);const R=r*S,Ry=R*sE,side=o.cs||shade(c,.8);
  return `<ellipse cx="${f(bx)}" cy="${f(by)}" rx="${f(R)}" ry="${f(Ry)}" fill="${side}"/>`+
  `<rect x="${f(bx-R)}" y="${f(ty)}" width="${f(2*R)}" height="${f(by-ty)}" fill="${side}"/>`+
  `<ellipse cx="${f(tx)}" cy="${f(ty)}" rx="${f(R)}" ry="${f(Ry)}" fill="${c}" stroke="${o.st||'rgba(70,45,25,.18)'}" stroke-width="${o.sw||.6}"/>`;}
function cyl(o,list=main){let s=cylSvg(o);if(o.extra)s+=o.extra(P(o.cx,o.cy,(o.z||0)+o.h));
  if(o.sh&&!(o.z>.05)) shadows+=ellipseAt(o.cx+o.h*.25,o.cy+o.h*.12,0,o.r*1.05,'#4a3018');
  const it={bb:[o.cx-o.r,o.cy-o.r,o.z||0,o.cx+o.r,o.cy+o.r,(o.z||0)+o.h],svg:s};list.push(it);return it;}
function item(bb,svg,list=main){const it={bb,svg};list.push(it);return it;}

/* 裝飾 */
const BOOK=['#a8573c','#d7b46a','#6f7d55','#e9dcc3','#7c4a35','#b98a5a','#59614c','#c98b6b','#efe5d2'];
const shelves=rows=>({F,w,h})=>{let s='';const n=rows||4,gap=h/n;
  for(let r=0;r<n;r++){const v0=r*gap+.08;s+=line(F(.06,v0),F(w-.06,v0),'#4d3424',1.1);
    if(r===n-1)break;let u=.14;while(u<w-.25){const bw=.09+rnd()*.1,bh=gap*(.55+rnd()*.3);
      if(rnd()<.12){u+=.22;continue;}
      s+=poly([F(u,v0+.03),F(u+bw,v0+.03),F(u+bw,v0+bh),F(u,v0+bh)],BOOK[(rnd()*BOOK.length)|0]);u+=bw+.015;}}
  return s;};
const drawers=n=>({F,w,h})=>{let s='';for(let i=1;i<n;i++)s+=line(F(.05,h*i/n),F(w-.05,h*i/n),'rgba(40,25,15,.45)',.8);
  for(let i=0;i<n;i++){const v=h*(i+.62)/n;s+=line(F(w*.38,v),F(w*.62,v),C.brass,1.6,'stroke-linecap="round"');}return s;};
const slats=(step=.2,col='rgba(70,45,25,.35)')=>({F,w,h})=>{let s='';for(let u=step;u<w;u+=step)s+=line(F(u,0),F(u,h),col,.8);return s;};
const slatsR=(step=.2,col='rgba(70,45,25,.35)')=>({R,d,h})=>{let s='';for(let u=step;u<d;u+=step)s+=line(R(u,0),R(u,h),col,.8);return s;};

function plant(cx,cy,s=1,kind=0){
  const r=.3*s,h=.55*s;let svg=cylSvg({cx,cy,r,h,c:kind===2?'#c98a5e':'#ece3d4',cs:kind===2?'#b0734b':'#d9cdb9'});
  const [tx,ty]=P(cx,cy,h);const k=S*s;
  if(kind===1){ // 虎尾蘭
    const cols=['#5f8a4a','#7aa25a','#4f7a3e'];
    [[-.18,-1.3,-.12],[.02,-1.55,0],[.2,-1.2,.1],[-.05,-1.05,-.05],[.12,-1.4,.06]].forEach((l,i)=>{

/* 玻璃隔間（黃銅細框） */
const glassAttr='stroke="rgba(255,255,255,.75)" stroke-width=".7"';
const postSet=new Set();
function post(x,y){const key=f(x)+','+f(y);if(postSet.has(key))return;postSet.add(key);box({x:x-.06,y:y-.06,z:.1,w:.12,d:.12,h:2.92,c:C.brass,st:'rgba(120,90,40,.3)'});}
function subtract(a,b,gaps){let segs=[[a,b]];gaps.forEach(([g1,g2])=>{segs=segs.flatMap(([s1,s2])=>g2<=s1||g1>=s2?[[s1,s2]]:[[s1,Math.max(s1,g1)],[Math.min(s2,g2),s2]].filter(s=>s[1]-s[0]>.05));});return segs;}
function partitionX(x,y1,y2,gaps=[]){
  subtract(y1,y2,gaps).forEach(([a,b])=>{
    box({x:x-.05,y:a,w:.1,d:b-a,h:.1,c:C.brass,st:'rgba(120,90,40,.3)'});
    box({x:x-.05,y:a,z:3.02,w:.1,d:b-a,h:.1,c:C.brass,st:'rgba(120,90,40,.3)'});
    const n=Math.max(1,Math.round((b-a)/2.4));
    for(let i=0;i<=n;i++)post(x,a+(b-a)*i/n);

/* ───────── 排序（畫家演算法＋前後關係） ───────── */
function sortItems(list){
  const n=list.length;
  list.forEach(it=>{let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;const [a,b,c,d,e,g]=it.bb;
    for(const X of [a,d])for(const Y of [b,e])for(const Z of [c,g]){const p=P(X,Y,Z);x1=Math.min(x1,p[0]);x2=Math.max(x2,p[0]);y1=Math.min(y1,p[1]);y2=Math.max(y2,p[1]);}
    it.r=[x1,y1,x2,y2];it.k=((a+d)/2*sT+(b+e)/2*cT)+(c+g)/2*.02;});
  const E=1e-6,behind=(A,B)=>A.bb[3]<=B.bb[0]+E||A.bb[4]<=B.bb[1]+E||A.bb[5]<=B.bb[2]+E;
  const adj=list.map(()=>[]),deg=new Array(n).fill(0);
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const A=list[i],B=list[j];
    if(A.r[2]<=B.r[0]||B.r[2]<=A.r[0]||A.r[3]<=B.r[1]||B.r[3]<=A.r[1])continue;
    const ab=behind(A,B),ba=behind(B,A);let from=-1;
    if(ab&&!ba)from=i;else if(ba&&!ab)from=j;else if(ab&&ba)from=A.k<=B.k?i:j;
    if(from<0)continue;const to=from===i?j:i;adj[from].push(to);deg[to]++;}
  const out=[],done=new Array(n).fill(false);let ready=[];for(let i=0;i<n;i++)if(!deg[i])ready.push(i);
  while(out.length<n){
    if(!ready.length){let best=-1;for(let i=0;i<n;i++)if(!done[i]&&(best<0||deg[i]<deg[best]||(deg[i]===deg[best]&&list[i].k<list[best].k)))best=i;ready.push(best);deg[best]=0;}
    let bi=0;for(let q=1;q<ready.length;q++)if(list[ready[q]].k<list[ready[bi]].k)bi=q;
    const i=ready.splice(bi,1)[0];if(done[i])continue;done[i]=true;out.push(list[i]);
    for(const t of adj[i]){if(--deg[t]===0&&!done[t])ready.push(t);}
  }
  return out.map(it=>it.svg).join('');
}

/* ───────── 輸出 SVG ───────── */
const vx1=P(0,D)[0]-1.6*S, vx2=P(W,0)[0]+1.6*S, vy1=P(0,0,WH)[1]-4.2*S, vy2=P(W,D,-1.1)[1]+1.0*S;

/* ───────── 旋轉方塊 ───────── */
const cube=document.getElementById('cube');
const V=[];for(const a of [-1,1])for(const b of [-1,1])for(const c of [-1,1])V.push([a,b,c]);
const EDG=[];for(let i=0;i<8;i++)for(let j=i+1;j<8;j++){let d=0;for(let k=0;k<3;k++)if(V[i][k]!==V[j][k])d++;if(d===1)EDG.push([i,j]);}
const t1=Math.PI/4,t2=Math.atan(1/Math.SQRT2);
function drawCube(t){const sz=1.45,bob=Math.sin(t*.9)*.12;
  const pts3=V.map(([x,y,z])=>{let X=x,Y=y*Math.cos(t1)-z*Math.sin(t1),Z=y*Math.sin(t1)+z*Math.cos(t1);
    let X2=X*Math.cos(t2)+Z*Math.sin(t2),Z2=-X*Math.sin(t2)+Z*Math.cos(t2);
    const a=t*.35;const X3=X2*Math.cos(a)-Y*Math.sin(a),Y3=X2*Math.sin(a)+Y*Math.cos(a);
    return [23+X3*sz,17.5+Y3*sz,3.4+bob+Z2*sz];});
  const sp=pts3.map(p=>P(...p)),dep=pts3.map(p=>(p[0]*sT+p[1]*cT)*cE+p[2]*sE);
  const md=dep.reduce((a,b)=>a+b)/8;
  let s=`<circle cx="${f(P(23,17.5,3.4+bob)[0])}" cy="${f(P(23,17.5,3.4+bob)[1])}" r="${f(1.6*S)}" fill="url(#glow)" opacity=".7"/>`;
  const es=EDG.map(([i,j])=>({i,j,d:(dep[i]+dep[j])/2})).sort((a,b)=>a.d-b.d);
  es.forEach(e=>{const back=e.d<md;s+=line(sp[e.i],sp[e.j],back?'rgba(167,130,63,.45)':'#b88d43',back?1.4:2.4,'stroke-linecap="round"');
    if(!back)s+=line(sp[e.i],sp[e.j],'rgba(255,246,220,.85)',.7,'stroke-linecap="round"');});
  sp.forEach((p,i)=>{if(dep[i]>=md)s+=`<circle cx="${f(p[0])}" cy="${f(p[1])}" r="2" fill="#f4d48a"/>`;});
  const c=P(23,17.5,3.4+bob);s+=`<circle cx="${f(c[0])}" cy="${f(c[1])}" r="3.2" fill="#fff3cf"/>`;
  cube.innerHTML=s;}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce)drawCube(.6);else{const t0=performance.now();const loop=n=>{drawCube((n-t0)/1000);requestAnimationFrame(loop);};requestAnimationFrame(loop);}

/* ───────── 拖曳／縮放 ───────── */
const stage=document.getElementById('stage');let vb={...base};
const apply=()=>svg.setAttribute('viewBox',`${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}`);
function clampVB(){vb.w=Math.min(vb.w,base.w*1.2);vb.h=vb.w*base.h/base.w;
  const mx=base.w*.25,my=base.h*.25;vb.x=Math.max(base.x-mx,Math.min(vb.x,base.x+base.w+mx-vb.w));vb.y=Math.max(base.y-my,Math.min(vb.y,base.y+base.h+my-vb.h));}
function unitsPerPx(){const r=svg.getBoundingClientRect();return Math.max(vb.w/r.width,vb.h/r.height);}
function toSvg(cx,cy){const r=svg.getBoundingClientRect(),u=unitsPerPx();const ox=(r.width*u-vb.w)/2,oy=(r.height*u-vb.h)/2;return [vb.x-ox+(cx-r.left)*u,vb.y-oy+(cy-r.top)*u];}
function zoomAt(k,sx,sy){const nw=Math.max(base.w/6,Math.min(base.w*1.2,vb.w/k));const r=nw/vb.w;vb.x=sx-(sx-vb.x)*r;vb.y=sy-(sy-vb.y)*r;vb.w=nw;vb.h=vb.h*r;clampVB();apply();}
function focus(x,y,w){vb.w=w;vb.h=w*base.h/base.w;vb.x=x-vb.w/2;vb.y=y-vb.h/2;clampVB();apply();}
svg.addEventListener('wheel',e=>{e.preventDefault();const [x,y]=toSvg(e.clientX,e.clientY);zoomAt(e.deltaY<0?1.15:1/1.15,x,y);},{passive:false});
const ptrs=new Map();let moved=0,pinch0=null;
svg.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=0;svg.setPointerCapture(e.pointerId);svg.classList.add('drag');
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0={d:Math.hypot(a[0]-b[0],a[1]-b[1]),w:vb.w};}});
svg.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const prev=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2&&pinch0){const [a,b]=[...ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);const [cx,cy]=toSvg((a[0]+b[0])/2,(a[1]+b[1])/2);
    zoomAt(vb.w/(pinch0.w*pinch0.d/d),cx,cy);moved+=10;return;}
  const u=unitsPerPx(),dx=e.clientX-prev[0],dy=e.clientY-prev[1];moved+=Math.abs(dx)+Math.abs(dy);vb.x-=dx*u;vb.y-=dy*u;clampVB();apply();});
const up=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=null;if(!ptrs.size)svg.classList.remove('drag');};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
const center=()=>[vb.x+vb.w/2,vb.y+vb.h/2];
document.getElementById('zin').onclick=()=>zoomAt(1.35,...center());
document.getElementById('zout').onclick=()=>zoomAt(1/1.35,...center());
document.getElementById('zreset').onclick=()=>{vb={...base};apply();};
if(stage.clientWidth<640){const c=P(23,12,1);focus(c[0],c[1],base.w/2.1);}

/* ───────── 名冊與詳情 ───────── */
const roster=document.getElementById('roster');
roster.innerHTML=ALL.map(m=>`<button type="button" class="member" data-id="${m.id}"><div class="av">${avatar(m)}</div>
  <div class="dept"><span class="chip">${m.dept}</span><span class="st"><i class="dot" style="background:${ST[m.status].c}"></i>${m.boss?'主人':ST[m.status].t}</span>${m.pin?'<span class="st">★ 釘選</span>':''}</div>
  <div class="mt">${m.title}</div><div class="ms">${m.boss?'整間辦公室的主人':m.sum}</div></button>`).join('');
const sheet=document.getElementById('sheet');
function tagPos(id){const t=tags.find(t=>t.m.id===id);return t?[t.x,t.y+30]:null;}
function select(id,pan){
  document.querySelectorAll('.sel').forEach(el=>el.classList.remove('sel'));
  if(!id){sheet.hidden=true;return;}
  const m=byId[id];document.querySelectorAll(`[data-id="${id}"]`).forEach(el=>el.classList.add('sel'));
  document.getElementById('sh-av').innerHTML=avatar(m);
  document.getElementById('sh-dept').innerHTML=`<span class="chip">${m.dept}</span><span class="st"><i class="dot" style="background:${ST[m.status].c}"></i>${m.boss?'主人':ST[m.status].t}</span>`;
  document.getElementById('sh-title').textContent=m.title;
  document.getElementById('sh-sum').textContent=m.sum;
  document.getElementById('sh-meta').textContent=m.updated?`最後更新 ${m.updated}${m.pin?'・已釘選':''}`:'';
  const a=document.getElementById('sh-link');if(m.sid){a.hidden=false;a.href='https://claude.ai/code/'+m.sid;}else a.hidden=true;
  sheet.hidden=false;
  if(pan){const p=tagPos(id);if(p){focus(p[0],p[1]+(stage.clientWidth<640?40:0),Math.min(vb.w,base.w/2.2));stage.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});}}
}
svg.addEventListener('click',e=>{if(moved>6)return;const el=e.target.closest('[data-id]');select(el?el.dataset.id:null);});
roster.addEventListener('click',e=>{const el=e.target.closest('[data-id]');if(el)select(el.dataset.id,true);});
document.getElementById('sh-close').onclick=()=>select(null);
document.addEventListener('keydown',e=>{if(e.key==='Escape')select(null);});
})();
