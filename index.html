<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14324a">
<title>穿線標籤列印</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one narrow column for a phone at the stringing counter — label preview on top, form, big print button pinned to the bottom. */
:root {
  --bg: #eef2f5;
  --surface: #ffffff;
  --ink: #14212b;
  --muted: #5d6b77;
  --line: #d3dbe2;
  --accent: #14324a;
  --accent-ink: #ffffff;
  --chip: #e2e9ef;
  --ok: #1f7a4d;
  --warn: #a35c00;
  --err: #b3261e;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161c; --surface: #18222b; --ink: #e6edf2; --muted: #93a3b0; --line: #2b3946;
    --accent: #8cc4ef; --accent-ink: #0b1a26; --chip: #22303c; --ok: #5fcf96; --warn: #f0b35a; --err: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161c; --surface: #18222b; --ink: #e6edf2; --muted: #93a3b0; --line: #2b3946;
  --accent: #8cc4ef; --accent-ink: #0b1a26; --chip: #22303c; --ok: #5fcf96; --warn: #f0b35a; --err: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(120px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
.status {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px;
  border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap;
}
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.on { color: var(--ok); }
.status.busy { color: var(--warn); }
.banner { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--err); color: var(--err); font-size: 14px; }

.preview { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.tape { background: #c9d1d8; border-radius: 6px; padding: 10px 0; display: flex; justify-content: center; }
.tape canvas {
  width: min(100%, 352px); aspect-ratio: 22 / 12; height: auto; max-width: 100%;
  image-rendering: pixelated; background: #fff; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.25);
}
.cap { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

form { display: grid; gap: 18px; }
.field { display: grid; gap: 6px; min-width: 0; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
label.lbl, .lbl { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .04em; }
.edit {
  font: inherit; font-size: 13px; color: var(--accent); background: none; border: 0; padding: 4px 2px; cursor: pointer;
}
input, select {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px;
}
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#phone { font-family: var(--font-num), var(--font-body); font-size: 30px; font-weight: 700; letter-spacing: .08em; text-align: center; padding: 4px 12px; }
#phone::placeholder { font-size: 17px; letter-spacing: 0; font-weight: 400; font-family: var(--font-body); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 1px solid transparent;
  background: var(--chip); color: var(--ink); cursor: pointer; min-height: 36px;
}
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; background: var(--surface); }
.chip.add { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
.num { font-family: var(--font-num); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }

.editor { display: grid; gap: 6px; padding: 10px; border: 1px dashed var(--line); border-radius: 12px; }
.editor-row { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; }
.editor-row input { min-height: 40px; padding: 6px 10px; }
.icon-btn {
  font: inherit; font-size: 13px; min-width: 44px; min-height: 40px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
}
.icon-btn.del { color: var(--err); }
.editor-actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap; }

.tension-box { display: grid; gap: 12px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.sub { display: grid; gap: 6px; }
.inline { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 20px; height: 20px; min-height: 0; }
.out { font-size: 13px; color: var(--muted); }
.out b { color: var(--ink); font-family: var(--font-num); font-size: 18px; }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
summary { padding: 12px 14px; cursor: pointer; font-weight: 500; }
.panel { padding: 0 14px 14px; display: grid; gap: 14px; }
.logo-row { display: flex; gap: 12px; align-items: center; }
.logo-row canvas { width: 64px; height: 64px; border: 1px solid var(--line); border-radius: 8px; background: #fff; image-rendering: pixelated; flex: none; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

.history { display: grid; gap: 6px; }
.hist-item {
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
  padding: 8px 10px; border-radius: 10px; background: var(--chip); font-size: 14px;
}
.hist-item > span { min-width: 0; }
.hist-item .num { font-size: 20px; }
.hist-item button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.empty { font-size: 13px; color: var(--muted); margin: 0; }
.match { display: grid; gap: 6px; }
.match .hint { font-size: 13px; }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.doing { color: var(--warn); border-color: var(--warn); }
.pill.ready { color: var(--ok); border-color: var(--ok); }
.order { display: grid; gap: 8px; padding: 10px; border-radius: 10px; background: var(--chip); }
.order-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.order-top .num { font-size: 20px; }
.order-info { font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.order-sub { font-size: 12px; color: var(--muted); }
.order-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.order-actions button { font: inherit; font-size: 14px; font-weight: 700; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.order-actions button.ghost { background: var(--surface); color: var(--accent); }
.order-actions button:disabled { opacity: .5; }
summary .pill { margin-left: 6px; }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.bar-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: auto auto 1fr; gap: 10px; align-items: center; }
.btn {
  font: inherit; font-weight: 700; border-radius: 12px; min-height: 52px; padding: 0 16px; cursor: pointer;
  border: 1px solid var(--accent); background: transparent; color: var(--accent);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); font-size: 18px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; min-height: 52px; }
.qty button { font: inherit; font-size: 20px; width: 36px; height: 50px; border: 0; background: none; color: var(--ink); cursor: pointer; }
.qty span { min-width: 22px; text-align: center; }
#msg { font-size: 13px; color: var(--muted); text-align: center; min-height: 1.5em; margin: 6px 0 0; }
#msg.err { color: var(--err); }
#msg.ok { color: var(--ok); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>穿線標籤</h1>
    <span id="status" class="status">未連線</span>
  </header>

  <div id="noBt" class="banner" hidden>這個瀏覽器不能用藍牙列印。請用 Android 手機的 Chrome 打開這個網址。</div>

  <section class="preview" aria-label="標籤預覽">
    <div class="tape"><canvas id="label" width="176" height="96"></canvas></div>
    <div class="cap"><span>實際列印效果 · 22 × 12 mm</span><span id="logoHint">尚未設定 LOGO（在下方「設定」上傳）</span></div>
  </section>

  <form id="form" autocomplete="off">
    <div class="field">
      <input id="phone" maxlength="8" placeholder="手機末三碼/名字" aria-label="手機末三碼/名字" required>
      <div id="custMatch" class="match" hidden></div>
    </div>

    <div class="field">
      <div class="head"><label class="lbl" for="string">線種</label><button type="button" class="edit" data-edit="strings">編輯按鈕</button></div>
      <input id="string" placeholder="點下方按鈕，或直接輸入" maxlength="16">
      <div id="stringChips"></div>
    </div>

    <div class="tension-box">
      <div class="sub">
        <div class="head"><label class="lbl" for="tension">磅數（主線）</label><button type="button" class="edit" data-edit="tensions">編輯按鈕</button></div>
        <input id="tension" inputmode="decimal" placeholder="例如 25" maxlength="5">
        <div id="tensionChips"></div>
      </div>

      <div class="sub">
        <label class="check"><input id="crossOn" type="checkbox"> 橫線不同磅</label>
        <div id="crossBox" class="inline" hidden>
          <input id="cross" inputmode="decimal" placeholder="橫線磅數" maxlength="5" aria-label="橫線磅數">
          <div class="chips" id="crossChips"></div>
        </div>
      </div>

      <div class="sub">
        <div class="head"><span class="lbl">預拉</span><button type="button" class="edit" data-edit="pres">編輯按鈕</button></div>
        <div id="preChips"></div>
      </div>

      <div class="out">標籤上會印：<b id="tensionOut">—</b></div>
    </div>

    <div class="field">
      <label class="lbl" for="date">日期</label>
      <input id="date" type="date">
    </div>
  </form>

  <details id="ordersBox" open hidden>
    <summary>穿線中的球拍 <span id="ordersCount" class="pill" hidden></span></summary>
    <div class="panel">
      <div class="head"><span class="hint" id="ordersHint"></span><button type="button" class="edit" id="ordersRefresh">重新整理</button></div>
      <div id="orders" class="history"></div>
    </div>
  </details>

  <details>
    <summary>最近列印</summary>
    <div class="panel"><div class="history" id="history"></div></div>
  </details>

  <details id="settings">
    <summary>設定（LOGO、濃度、方向）</summary>
    <div class="panel">
      <div class="logo-row">
        <canvas id="logoThumb" width="80" height="80"></canvas>
        <div class="field" style="flex:1">
          <label class="lbl" for="logoFile">店家 LOGO</label>
          <input id="logoFile" type="file" accept="image/*">
          <button id="logoReset" class="chip" type="button" style="justify-self:start">換回嘉友 LOGO</button>
        </div>
      </div>
      <div class="field">
        <label class="lbl" for="shopName">LOGO 下方的店名</label>
        <input id="shopName" maxlength="8">
      </div>
      <div class="field">
        <label class="lbl" for="thresh">LOGO 黑白門檻 <span id="threshVal" class="num"></span></label>
        <input id="thresh" type="range" min="40" max="230" step="5">
        <p class="hint">標籤機只印黑白。LOGO 太黑就往左拉，太淡就往右拉。</p>
      </div>
      <div class="row">
        <div class="field">
          <label class="lbl" for="density">列印濃度</label>
          <select id="density"><option value="1">1（淡）</option><option value="2">2（標準）</option><option value="3">3（深）</option></select>
        </div>
        <div class="field">
          <label class="lbl" for="dateFmt">日期格式</label>
          <select id="dateFmt"><option value="dash">2026-11-01</option><option value="slash">2026/11/01</option><option value="md">11/01</option></select>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label class="lbl" for="unit">磅數單位</label>
          <select id="unit"><option value="p">25p</option><option value=" 磅">25 磅</option><option value=" lbs">25 lbs</option></select>
        </div>
        <div class="field">
          <label class="lbl" for="preFmt">預拉寫法</label>
          <select id="preFmt"><option value="plain">10%</option><option value="plus">+10%</option></select>
        </div>
      </div>
      <div class="field">
        <span class="lbl">雲端紀錄（LINE 取拍系統）</span>
        <input id="apiUrl" placeholder="Apps Script 網頁應用程式網址" aria-label="Apps Script 網址" inputmode="url">
        <input id="apiKey" placeholder="店家密碼" aria-label="店家密碼" type="password">
        <div class="head"><span class="hint" id="apiResult">填好後，列印時會自動建立穿線紀錄。</span><button type="button" class="chip" id="apiTest">測試連線</button></div>
      </div>
      <label class="check"><input id="logoRight" type="checkbox"> LOGO 放右邊</label>
      <label class="check"><input id="rotate" type="checkbox"> 列印方向轉 180°（印出來顛倒時勾選）</label>
    </div>
  </details>
</div>

<div class="bar">
  <div class="bar-in">
    <button id="connect" class="btn" type="button">連線</button>
    <div class="qty" aria-label="列印張數">
      <button type="button" id="minus" aria-label="減少張數">−</button>
      <span id="qty" class="num">1</span>
      <button type="button" id="plus" aria-label="增加張數">＋</button>
    </div>
    <button id="print" class="btn primary" type="button" disabled>列印</button>
  </div>
  <p id="msg" role="status"></p>
</div>

<script src="https://unpkg.com/@mmote/niimbluelib@0.47.1/dist/umd/niimbluelib.min.js"></script>
<script>
(() => {

  const store = {

  const cfg = Object.assign({

  let logoImg = null;
  let qty = 1;
  let client = null;
  let busy = false;
  let pre = "";          // selected pre-stretch %, "" = none
  const editing = {};    // which chip list is in edit mode
  let selPhone = "";     // customer chosen for this label (full phone)
  let matches = [];
  const lib = window.niimbluelib;

  // ---------- tension text ----------
  const isNum = (v) => /^\d+(\.\d+)?$/.test(v);
  function tensionText(main, cross, p) {
    main = (main || "").trim(); cross = (cross || "").trim();
    if (!main) return "";
    let t = main;
    if (cross && cross !== main) t += "/" + cross;
    if (isNum(main) && (!cross || isNum(cross))) t += cfg.unit;
    if (p) t += cfg.preFmt === "plus" ? ` +${p}%` : ` ${p}%`;
    return t;
  }
  const currentCross = () => ($("crossOn").checked ? $("cross").value : "");
  const currentTension = () => tensionText($("tension").value, currentCross(), pre);

  // ---------- label drawing ----------
  const canvas = $("label");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  function fmtDate(v) {
    if (!v) return "";
    const [y, m, d] = v.split("-");
    if (cfg.dateFmt === "md") return `${m}/${d}`;
    return cfg.dateFmt === "slash" ? `${y}/${m}/${d}` : `${y}-${m}-${d}`;
  }

  function fitText(text, x, y, maxW, size, weight, family) {
    let s = size;
    do { ctx.font = `${weight} ${s}px ${family}`; if (ctx.measureText(text).width <= maxW) break; s -= 1; } while (s > 8);
    ctx.fillText(text, x, y);
    return s;
  }

  function threshold(c, x, y, w, h, t) {
    const img = c.getImageData(x, y, w, h), p = img.data;
    for (let i = 0; i < p.length; i += 4) {
      const a = p[i + 3] / 255;
      const lum = (0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]) * a + 255 * (1 - a);
      const v = lum < t ? 0 : 255;
      p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = 255;
    }
    c.putImageData(img, x, y);
  }

  function drawLogo(c, x, y, w, h) {
    if (!logoImg) return;
    const r = Math.min(w / logoImg.width, h / logoImg.height);
    const dw = Math.round(logoImg.width * r), dh = Math.round(logoImg.height * r);
    c.fillStyle = "#fff"; c.fillRect(x, y, w, h);
    c.drawImage(logoImg, x + Math.round((w - dw) / 2), y + Math.round((h - dh) / 2), dw, dh);
    threshold(c, x, y, w, h, cfg.thresh);
  }

  const LABEL_FONT = '"Barlow Condensed", "Noto Sans TC", "Noto Sans CJK TC", sans-serif';
  const CJK_FONT = '"Noto Sans TC", "Noto Sans CJK TC", sans-serif';

  // Layout follows the shop's existing label: logo + shop name on the left,
  // name / string + tension / date on the right. With cross tension AND
  // pre-stretch, name + string share line 1 and tension gets line 2.
  // Otherwise, if string + tension do not fit on one line, they get a line each.
  function render() {
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
    const leftW = 80, colGap = 8;
    const lx = cfg.logoRight ? W - leftW - 4 : 4;
    const rx = cfg.logoRight ? 4 : 4 + leftW + colGap;
    const rw = W - leftW - colGap - 8;
    const logoS = 58;
    drawLogo(ctx, lx + (leftW - logoS) / 2, 5, logoS, logoS);

    const name = $("phone").value.trim();
    const str = $("string").value.trim();
    const ten = currentTension();
    const date = fmtDate($("date").value);
    $("tensionOut").textContent = ten || "—";

    ctx.fillStyle = "#000"; ctx.textBaseline = "alphabetic"; ctx.textAlign = "center";
    if (cfg.shopName) fitText(cfg.shopName, lx + leftW / 2, 84, leftW, 17, 900, CJK_FONT);
    const cx = rx + rw / 2;
    // Line 2 sits beside the logo, so it may grow left up to the logo's edge.
    const logoEdge = cfg.logoRight ? lx + (leftW - logoS) / 2 - 3 : lx + (leftW + logoS) / 2 + 3;
    const ex0 = cfg.logoRight ? 3 : logoEdge, ex1 = cfg.logoRight ? logoEdge : W - 3;
    const widthAt = (t, size) => { ctx.font = `700 ${size}px ${LABEL_FONT}`; return ctx.measureText(t).width; };
    function placeLine2(t) {
      for (let s = 23; s >= 20; s--) if (widthAt(t, s) <= rw) return { x: cx, s };
      for (let s = 21; s >= 15; s--) if (widthAt(t, s) <= ex1 - ex0) return { x: (ex0 + ex1) / 2, s };
      return null;
    }
    function drawLine2(p, t) { ctx.font = `700 ${p.s}px ${LABEL_FONT}`; ctx.fillText(t, p.x, 58); }

    const combined = [str, ten].filter(Boolean).join("  ");
    const crossCross = currentCross().trim() && currentCross().trim() !== $("tension").value.trim();
    const p2 = placeLine2(crossCross && pre ? ten : combined);
    if (crossCross && pre && p2) {
      // name + string also sits beside the logo: grow left before shrinking
      const l1 = [name || "---", str].filter(Boolean).join(" ");
      ctx.font = `900 20px ${LABEL_FONT}`;
      if (ctx.measureText(l1).width <= rw) fitText(l1, cx, 32, rw, 24, 900, LABEL_FONT);
      else fitText(l1, (ex0 + ex1) / 2, 32, ex1 - ex0, 22, 900, LABEL_FONT);
      drawLine2(p2, ten);
    } else if (!(crossCross && pre) && p2) {
      fitText(name || "---", cx, 32, rw, 24, 900, LABEL_FONT);
      drawLine2(p2, combined);
    } else {
      fitText(name || "---", cx, 22, rw, 21, 900, LABEL_FONT);
      fitText(str, cx, 42, rw, 18, 700, LABEL_FONT);
      fitText(ten, cx, 63, rw, 18, 700, LABEL_FONT);
    }
    fitText(date, cx, 84, rw, 19, 700, LABEL_FONT);
    ctx.textAlign = "left";
    threshold(ctx, 0, 0, W, H, 150);

    $("logoHint").hidden = !!logoImg;
    updatePrintBtn();
  }

  // Canvas only uses a web font once it is loaded, and CJK glyphs load per subset.
  let fontTimer = 0;
  function ensureFonts() {
    if (!document.fonts) return;
    clearTimeout(fontTimer);
    fontTimer = setTimeout(() => {
      const text = [$("phone").value, $("string").value, currentTension(), cfg.shopName, "0123456789-/p磅%+"].join("");
      Promise.all([
        document.fonts.load('900 24px "Noto Sans TC"', text),
        document.fonts.load('700 24px "Noto Sans TC"', text),
        document.fonts.load('900 24px "Barlow Condensed"', text),
        document.fonts.load('700 24px "Barlow Condensed"', text),
      ]).then(render, () => {});
    }, 150);
  }

  function printCanvas() {
    if (!cfg.rotate) return canvas;
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const x = c.getContext("2d");
    x.translate(W, H); x.rotate(Math.PI); x.drawImage(canvas, 0, 0);
    return c;
  }

  // ---------- editable chip lists ----------
  const groups = {
    strings: { box: "stringChips", input: "string", fmt: (v) => v, placeholder: "線種名稱" },
    tensions: { box: "tensionChips", input: "tension", fmt: (v) => v + (isNum(v) ? cfg.unit : ""), placeholder: "磅數，例如 25" },
    pres: { box: "preChips", fmt: (v) => v + "%", placeholder: "預拉 %，例如 10" },
  };

  function el(tag, props, ...kids) {
    const e = document.createElement(tag);
    Object.assign(e, props || {});
    kids.forEach((k) => e.append(k));
    return e;
  }

  function drawGroup(key) {
    const g = groups[key], box = $(g.box), list = cfg[key];
    box.innerHTML = "";
    document.querySelector(`[data-edit="${key}"]`).textContent = editing[key] ? "完成" : "編輯按鈕";

    if (editing[key]) {
      const ed = el("div", { className: "editor" });
      list.forEach((v, i) => {
        const inp = el("input", { value: v, placeholder: g.placeholder, ariaLabel: g.placeholder });
        if (key !== "strings") inp.inputMode = "decimal";
        inp.addEventListener("change", () => {
          const nv = inp.value.trim().replace(/%$/, "");
          if (nv) list[i] = nv; else list.splice(i, 1);
          saveCfg(); drawGroup(key);
        });
        const up = el("button", { type: "button", className: "icon-btn", textContent: "↑", ariaLabel: "往前移", disabled: i === 0 });
        up.onclick = () => { [list[i - 1], list[i]] = [list[i], list[i - 1]]; saveCfg(); drawGroup(key); };
        const del = el("button", { type: "button", className: "icon-btn del", textContent: "刪除" });
        del.onclick = () => { list.splice(i, 1); saveCfg(); drawGroup(key); };
        ed.append(el("div", { className: "editor-row" }, inp, up, del));
      });
      const add = el("button", { type: "button", className: "chip add", textContent: "＋ 新增一個" });
      add.onclick = () => {
        list.push(""); drawGroup(key);
        const inputs = $(g.box).querySelectorAll(".editor-row input");
        const last = inputs[inputs.length - 1];
        last.addEventListener("blur", () => { if (!last.value.trim()) { const j = list.indexOf(""); if (j >= 0) { list.splice(j, 1); drawGroup(key); } } }, { once: true });
        last.focus();
      };
      const done = el("button", { type: "button", className: "chip", textContent: "完成" });
      done.onclick = () => { editing[key] = false; cleanup(key); drawGroup(key); };
      ed.append(el("div", { className: "editor-actions" }, add, done));
      box.append(ed);
      return;
    }

    const row = el("div", { className: "chips" });
    const current = key === "pres" ? pre : $(g.input).value.trim();
    if (key === "pres") {
      const none = el("button", { type: "button", className: "chip", textContent: "不預拉" });
      none.setAttribute("aria-pressed", String(!pre));
      none.onclick = () => { pre = ""; onInput(); };
      row.append(none);
    }
    list.forEach((v) => {
      const b = el("button", { type: "button", className: "chip" + (key === "strings" ? "" : " num"), textContent: g.fmt(v) });
      b.setAttribute("aria-pressed", String(current === v));
      b.onclick = () => {
        if (key === "pres") pre = pre === v ? "" : v; else $(g.input).value = v;
        onInput();
      };
      row.append(b);
    });
    // offer to save a typed value that is not a button yet
    if (key === "strings" && current && !list.includes(current)) {
      const add = el("button", { type: "button", className: "chip add", textContent: `＋ 把「${current}」加成按鈕` });
      add.onclick = () => { list.push(current); saveCfg(); drawGroup(key); };
      row.append(add);
    }
    box.append(row);
  }

  function cleanup(key) {
    cfg[key] = cfg[key].map((v) => String(v).trim()).filter((v, i, a) => v && a.indexOf(v) === i);
    saveCfg();
  }

  document.querySelectorAll("[data-edit]").forEach((b) => {
    b.onclick = () => { const k = b.dataset.edit; editing[k] = !editing[k]; if (!editing[k]) cleanup(k); drawGroup(k); };
  });

  function drawCross() {
    const box = $("crossChips"); box.innerHTML = "";
    const main = parseFloat($("tension").value);
    if (isNaN(main)) return;
    [-1, 1, 2].forEach((d) => {
      const v = String(main + d);
      const b = el("button", { type: "button", className: "chip num", textContent: (d > 0 ? "+" : "") + d });
      b.setAttribute("aria-pressed", String($("cross").value.trim() === v));
      b.onclick = () => { $("cross").value = v; onInput(); };
      box.append(b);
    });
  }

  function refreshChips() { Object.keys(groups).forEach(drawGroup); drawCross(); }

  // ---------- cloud (Apps Script) ----------
  const cloudOn = () => !!(cfg.apiUrl && cfg.apiKey);
  async function api(action, data) {
    const r = await fetch(cfg.apiUrl, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ key: cfg.apiKey, action }, data || {})),
    });
    let j;
    try { j = await r.json(); } catch { throw new Error("網址不正確，或 Apps Script 沒有設定成「所有人」都能存取"); }
    if (!j.ok) throw new Error(j.error || "雲端回應錯誤");
    return j;
  }
  const mask = (p) => (p ? `${p.slice(0, 4)}-***-${p.slice(7)}` : "");

  let lookupTimer = 0, lookupSeq = 0;
  function scheduleLookup() {
    clearTimeout(lookupTimer);
    const q = $("phone").value.trim();
    selPhone = ""; matches = [];
    if (!cloudOn() || !q || (/^\d+$/.test(q) && q.length !== 3)) { drawMatches(); return; }
    lookupTimer = setTimeout(async () => {
      const seq = ++lookupSeq;
      try {
        const j = await api("lookup", { q });
        if (seq !== lookupSeq) return;
        matches = j.customers || [];
        if (matches.length === 1) selPhone = matches[0].phone;
      } catch (e) { matches = []; }
      drawMatches();
    }, 400);
  }
  function drawMatches() {
    const box = $("custMatch"); box.innerHTML = "";
    const q = $("phone").value.trim();
    box.hidden = !cloudOn() || !q;
    if (box.hidden) return;
    if (!matches.length) {
      box.append(el("span", { className: "hint", textContent: "找不到已綁定的客人。照樣可以列印，之後再通知。" }));
      return;
    }
    box.append(el("span", { className: "hint", textContent: matches.length > 1 ? "有好幾位客人，請選一位：" : "客人：" }));
    const row = el("div", { className: "chips" });
    matches.forEach((c) => {
      const b = el("button", { type: "button", className: "chip", textContent: `${c.name || "未命名"} ${mask(c.phone)}` });
      b.setAttribute("aria-pressed", String(selPhone === c.phone));
      b.onclick = () => { selPhone = selPhone === c.phone ? "" : c.phone; drawMatches(); };
      row.append(b);
    });
    box.append(row);
  }

  // records that failed to upload are kept and retried
  async function flushOutbox() {
    if (!cloudOn()) return 0;
    const box = store.get("outbox", []);
    const left = [];
    for (const item of box) {
      try { await api("create", item); } catch (e) { left.push(item); }
    }
    store.set("outbox", left);
    return left.length;
  }
  async function saveRecord(rec) {
    if (!cloudOn()) return "";
    const box = store.get("outbox", []); box.push(rec); store.set("outbox", box);
    const left = await flushOutbox();
    loadOrders();
    return left ? `，但有 ${left} 筆紀錄還沒上傳到試算表（下次會自動重試）` : "，已建立穿線紀錄";
  }

  let ordersLoading = false;
  async function loadOrders() {
    $("ordersBox").hidden = !cloudOn();
    if (!cloudOn() || ordersLoading) return;
    ordersLoading = true; $("ordersHint").textContent = "讀取中…";
    try {
      const j = await api("list");
      drawOrders(j.records || []);
      const n = store.get("outbox", []).length;
      $("ordersHint").textContent = n ? `有 ${n} 筆紀錄等待上傳` : "";
    } catch (e) {
      $("ordersHint").textContent = "讀取失敗：" + e.message;
    } finally { ordersLoading = false; }
  }
  function drawOrders(list) {
    const box = $("orders"); box.innerHTML = "";
    list = list.filter((r) => r.status === "穿線中");
    const cnt = $("ordersCount"); cnt.hidden = !list.length;
    cnt.textContent = `${list.length} 支`;
    if (!list.length) { box.append(el("p", { className: "empty", textContent: "目前沒有穿線中的球拍。" })); return; }
    list.forEach((r) => {
      const card = el("div", { className: "order" });
      const pill = el("span", { className: "pill " + (r.status === "穿線中" ? "doing" : "ready"), textContent: r.status });
      card.append(el("div", { className: "order-top" },
        el("span", { className: "num", textContent: r.name }), pill,
        el("span", { className: "order-sub", textContent: r.customer ? `${r.customer} ${mask(r.phone)}` : (r.phone ? mask(r.phone) : "未對應客人") })));
      card.append(el("div", { className: "order-info", textContent: [r.string, r.tension, fmtDate(r.date)].filter(Boolean).join(" · ") }));
      const actions = el("div", { className: "order-actions" });
      const note = el("div", { className: "order-sub" });
      const b = el("button", { type: "button", textContent: "球拍完成，通知客人" });
      b.onclick = () => ready(r, b, note, actions);
      actions.append(b);
      card.append(actions, note);
      box.append(card);
    });
  }
  async function ready(r, btn, note, actions, phone) {
    btn.disabled = true; note.textContent = "處理中…";
    try {
      const j = await api("ready", { id: r.id, phone });
      if (j.needChoice) {
        note.textContent = "末三碼有好幾位客人，請選是哪一位：";
        actions.innerHTML = "";
        j.candidates.forEach((c) => {
          const b = el("button", { type: "button", className: "ghost", textContent: `${c.name || "未命名"} ${mask(c.phone)}` });
          b.onclick = () => ready(r, b, note, actions, c.phone);
          actions.append(b);
        });
        return;
      }
      setMsg(j.notified ? `已用 LINE 通知 ${r.name}` : `${r.name} 已改成球拍完成（${j.reason}）`, j.notified ? "ok" : "");
      loadOrders();
    } catch (e) {
      btn.disabled = false; note.textContent = "失敗：" + e.message;
    }
  }

  // ---------- form ----------
  function today() {
    const d = new Date(), p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }

  function onInput() {
    $("crossBox").hidden = !$("crossOn").checked;
    store.set("draft", { string: $("string").value, tension: $("tension").value });
    refreshChips(); render(); ensureFonts();
  }

  function updatePrintBtn() {
    const ok = client && client.isConnected() && $("phone").value.trim() !== "" && !busy;
    $("print").disabled = !ok;
  }

  function setMsg(t, kind) { const m = $("msg"); m.textContent = t || ""; m.className = kind || ""; }
  function setStatus(t, kind) { const s = $("status"); s.textContent = t; s.className = "status" + (kind ? " " + kind : ""); }

  // ---------- logo ----------
  function loadLogo(dataUrl) {
    if (!dataUrl) { logoImg = null; drawThumb(); render(); return; }
    const img = new Image();
    img.onload = () => { logoImg = img; drawThumb(); render(); };
    img.src = dataUrl;
  }
  function drawThumb() {
    const t = $("logoThumb").getContext("2d");
    t.fillStyle = "#fff"; t.fillRect(0, 0, 80, 80);
    if (logoImg) drawLogo(t, 0, 0, 80, 80);
  }
  $("logoFile").addEventListener("change", (e) => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 320 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL("image/png");
      store.set("logo", url); loadLogo(url);
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(f);
  });

  // ---------- printer ----------
  async function connect() {
    if (client && client.isConnected()) { await client.disconnect(); return; }
    try {
      setStatus("連線中…", "busy"); setMsg("請在跳出的清單中選擇 D110");
      client = new lib.NiimbotBluetoothClient();
      client.on("disconnect", () => { setStatus("未連線"); $("connect").textContent = "連線"; updatePrintBtn(); });
      const info = await client.connect();
      const model = client.getModelMetadata()?.model || info.deviceName || "標籤機";
      setStatus("已連線 " + model, "on");
      $("connect").textContent = "中斷";
      setMsg("");
    } catch (e) {
      setStatus("未連線");
      setMsg(String(e && e.message || e).includes("cancel") ? "" : "連線失敗：" + (e.message || e) + "。確認標籤機已開機、手機藍牙已開啟。", "err");
    }
    updatePrintBtn();
  }

  async function print() {
    if (!client || !client.isConnected()) return;
    busy = true; updatePrintBtn(); setMsg("列印中…");
    const meta = client.getModelMetadata();
    const dir = meta?.printDirection || "left";
    const taskName = client.getPrintTaskType() || "D110";
    const n = qty;
    let task;
    try {
      const enc = lib.ImageEncoder.encodeCanvas(printCanvas(), lib.PageColorType.SingleColor, dir);
      task = client.protocol.newPrintTask(taskName, {
        totalPages: n, density: Number(cfg.density), labelType: lib.LabelType.WithGaps,
      });
      await task.printInit();
      await task.printPage(enc, n);
      await task.waitForFinished();
      addHistory();
      const rec = {
        name: $("phone").value.trim(), phone: selPhone, string: $("string").value.trim(),
        main: $("tension").value.trim(), cross: currentCross().trim(), pre, tension: currentTension(), date: $("date").value,
      };
      setMsg(`已列印 ${n} 張` + (cloudOn() ? "，正在建立紀錄…" : ""), "ok");
      saveRecord(rec).then((t) => { if (t) setMsg(`已列印 ${n} 張${t}`, t.includes("還沒") ? "err" : "ok"); });
      // next customer: clear the name and the one-off tension options
      $("phone").value = ""; $("crossOn").checked = false; $("cross").value = ""; pre = "";
      onInput(); scheduleLookup(); $("phone").focus();
    } catch (e) {
      setMsg("列印失敗：" + (e.message || e), "err");
    } finally {
      try { if (task) await task.printEnd(); else await client.protocol.printEnd(); } catch {}
      busy = false; updatePrintBtn();
    }
  }

  // ---------- history ----------
  function addHistory() {
    const h = store.get("history", []);
    h.unshift({
      phone: $("phone").value.trim(), string: $("string").value.trim(), tension: $("tension").value.trim(),
      cross: currentCross().trim(), pre, date: $("date").value,
    });
    store.set("history", h.slice(0, 20));
    drawHistory();
  }
  function drawHistory() {
    const h = store.get("history", []), box = $("history");
    box.innerHTML = "";
    if (!h.length) { box.append(el("p", { className: "empty", textContent: "印過的標籤會出現在這裡，點「帶入」可以補印。" })); return; }
    h.forEach((r) => {
      const n = el("span", { className: "num", textContent: r.phone });
      const t = el("span", { textContent: [r.string, tensionText(r.tension, r.cross, r.pre), fmtDate(r.date)].filter(Boolean).join(" · ") });
      const b = el("button", { type: "button", textContent: "帶入" });
      b.onclick = () => {
        $("phone").value = r.phone; $("string").value = r.string; $("tension").value = r.tension;
        $("crossOn").checked = !!r.cross; $("cross").value = r.cross || ""; pre = r.pre || "";
        $("date").value = r.date || today();
        onInput(); scheduleLookup(); window.scrollTo({ top: 0, behavior: "smooth" });
      };
      box.append(el("div", { className: "hist-item" }, n, t, b));
    });
  }

  // ---------- wire up ----------
  const draft = store.get("draft", {});
  $("string").value = draft.string || "";
  $("tension").value = draft.tension || "";
  $("date").value = today();
  $("thresh").value = cfg.thresh; $("threshVal").textContent = cfg.thresh;
  $("density").value = cfg.density; $("dateFmt").value = cfg.dateFmt;
  $("unit").value = cfg.unit; $("preFmt").value = cfg.preFmt; $("shopName").value = cfg.shopName;
  $("logoRight").checked = cfg.logoRight; $("rotate").checked = cfg.rotate;

  ["phone", "string", "tension", "cross", "date"].forEach((id) => $(id).addEventListener("input", onInput));
  $("phone").addEventListener("input", scheduleLookup);
  $("apiUrl").value = cfg.apiUrl; $("apiKey").value = cfg.apiKey;
  const saveApi = () => { cfg.apiUrl = $("apiUrl").value.trim(); cfg.apiKey = $("apiKey").value.trim(); saveCfg(); loadOrders(); };
  $("apiUrl").addEventListener("change", saveApi); $("apiKey").addEventListener("change", saveApi);
  $("apiTest").onclick = async () => {
    saveApi(); $("apiResult").textContent = "測試中…";
    try { const j = await api("ping"); $("apiResult").textContent = `連線成功：${j.shop}`; loadOrders(); }
    catch (e) { $("apiResult").textContent = "連線失敗：" + e.message; }
  };
  $("ordersRefresh").onclick = loadOrders;
  $("ordersBox").addEventListener("toggle", () => { if ($("ordersBox").open) loadOrders(); });
  $("crossOn").addEventListener("change", () => {
    if ($("crossOn").checked && !$("cross").value) {
      const m = parseFloat($("tension").value);
      if (!isNaN(m)) $("cross").value = String(m + 1);
    }
    onInput();
    if ($("crossOn").checked) $("cross").focus();
  });
  $("thresh").addEventListener("input", (e) => { cfg.thresh = +e.target.value; $("threshVal").textContent = cfg.thresh; saveCfg(); drawThumb(); render(); });
  $("density").addEventListener("change", (e) => { cfg.density = +e.target.value; saveCfg(); });
  $("dateFmt").addEventListener("change", (e) => { cfg.dateFmt = e.target.value; saveCfg(); render(); drawHistory(); });
  $("unit").addEventListener("change", (e) => { cfg.unit = e.target.value; saveCfg(); onInput(); drawHistory(); });
  $("preFmt").addEventListener("change", (e) => { cfg.preFmt = e.target.value; saveCfg(); onInput(); drawHistory(); });
  $("shopName").addEventListener("input", (e) => { cfg.shopName = e.target.value.trim(); saveCfg(); render(); ensureFonts(); });
  $("logoRight").addEventListener("change", (e) => { cfg.logoRight = e.target.checked; saveCfg(); render(); });
  $("rotate").addEventListener("change", (e) => { cfg.rotate = e.target.checked; saveCfg(); });
  $("logoReset").onclick = () => { try { localStorage.removeItem("sl.logo"); } catch {} loadLogo(DEFAULT_LOGO); };
  $("minus").onclick = () => { qty = Math.max(1, qty - 1); $("qty").textContent = qty; };
  $("plus").onclick = () => { qty = Math.min(20, qty + 1); $("qty").textContent = qty; };
  $("connect").onclick = connect;
  $("print").onclick = print;
  $("form").addEventListener("submit", (e) => { e.preventDefault(); if (!$("print").disabled) print(); });

  if (!navigator.bluetooth || !lib) { $("noBt").hidden = false; $("connect").disabled = true; }

  onInput(); drawHistory();
  flushOutbox().then(loadOrders);
  loadLogo(store.get("logo", DEFAULT_LOGO));
})();
</script>
</body>
</html>
