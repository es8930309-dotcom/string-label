<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14324a">
<title>穿線標籤列印</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: one narrow column for a phone at the stringing counter — label preview on top, form, big print button pinned to the bottom. */
:root {
  --bg: #eef2f5;
  --surface: #ffffff;
  --ink: #14212b;
  --muted: #5d6b77;
  --line: #d3dbe2;
  --accent: #14324a;
  --accent-ink: #ffffff;
  --chip: #e2e9ef;
  --ok: #1f7a4d;
  --warn: #a35c00;
  --err: #b3261e;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161c; --surface: #18222b; --ink: #e6edf2; --muted: #93a3b0; --line: #2b3946;
    --accent: #8cc4ef; --accent-ink: #0b1a26; --chip: #22303c; --ok: #5fcf96; --warn: #f0b35a; --err: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161c; --surface: #18222b; --ink: #e6edf2; --muted: #93a3b0; --line: #2b3946;
  --accent: #8cc4ef; --accent-ink: #0b1a26; --chip: #22303c; --ok: #5fcf96; --warn: #f0b35a; --err: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(12px + env(safe-area-inset-top, 0px)) calc(110px + env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
.status {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px;
  border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap;
}
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.on { color: var(--ok); }
.status.busy { color: var(--warn); }
.banner { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--err); color: var(--err); font-size: 14px; }

.preview { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.tape { background: #c9d1d8; border-radius: 6px; padding: 10px 0; display: flex; justify-content: center; }
.tape canvas {
  width: min(100%, 352px); aspect-ratio: 22 / 12; height: auto; max-width: 100%;
  image-rendering: pixelated; background: #fff; border-radius: 3px; box-shadow: 0 1px 2px rgba(0,0,0,.25);
}
.cap { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

form { display: grid; gap: 14px; }
.field { display: grid; gap: 6px; min-width: 0; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
label.lbl { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: .04em; }
input, select {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px;
}
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#phone { font-family: var(--font-num), var(--font-body); font-size: 30px; font-weight: 700; letter-spacing: .08em; text-align: center; padding: 4px 12px; }
#phone::placeholder { font-size: 17px; letter-spacing: 0; font-weight: 400; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; border: 1px solid transparent;
  background: var(--chip); color: var(--ink); cursor: pointer; min-height: 34px;
}
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.num { font-family: var(--font-num); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }

details { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
summary { padding: 12px 14px; cursor: pointer; font-weight: 500; }
.panel { padding: 0 14px 14px; display: grid; gap: 14px; }
.logo-row { display: flex; gap: 12px; align-items: center; }
.logo-row canvas { width: 64px; height: 64px; border: 1px solid var(--line); border-radius: 8px; background: #fff; image-rendering: pixelated; flex: none; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.check input { width: 20px; height: 20px; min-height: 0; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

.history { display: grid; gap: 6px; }
.hist-item {
  display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
  padding: 8px 10px; border-radius: 10px; background: var(--chip); font-size: 14px;
}
.hist-item .num { font-size: 22px; }
.hist-item button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.empty { font-size: 13px; color: var(--muted); }

.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.bar-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: auto auto 1fr; gap: 10px; align-items: center; }
.btn {
  font: inherit; font-weight: 700; border-radius: 12px; min-height: 52px; padding: 0 16px; cursor: pointer;
  border: 1px solid var(--accent); background: transparent; color: var(--accent);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); font-size: 18px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 12px; min-height: 52px; }
.qty button { font: inherit; font-size: 20px; width: 36px; height: 50px; border: 0; background: none; color: var(--ink); cursor: pointer; }
.qty span { min-width: 22px; text-align: center; }
#msg { font-size: 13px; color: var(--muted); text-align: center; min-height: 1.5em; margin: 6px 0 0; }
#msg.err { color: var(--err); }
#msg.ok { color: var(--ok); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>穿線標籤</h1>
    <span id="status" class="status">未連線</span>
  </header>

  <div id="noBt" class="banner" hidden>這個瀏覽器不能用藍牙列印。請用 Android 手機的 Chrome 打開這個網址。</div>

  <section class="preview" aria-label="標籤預覽">
    <div class="tape"><canvas id="label" width="176" height="96"></canvas></div>
    <div class="cap"><span>實際列印效果 · 22 × 12 mm</span><span id="logoHint">尚未設定 LOGO（在下方「設定」上傳）</span></div>
  </section>

  <form id="form" autocomplete="off">
    <div class="field">
      <label class="lbl" for="phone">手機末三碼 / 名字</label>
      <input id="phone" maxlength="8" placeholder="例如 527 或 皮卡中" required>
    </div>

    <div class="field">
      <label class="lbl" for="string">線種</label>
      <input id="string" placeholder="例如 BG65" maxlength="16">
      <div class="chips" id="stringChips"></div>
    </div>

    <div class="row">
      <div class="field">
        <label class="lbl" for="tension">磅數</label>
        <input id="tension" inputmode="decimal" placeholder="例如 25" maxlength="9">
      </div>
      <div class="field">
        <label class="lbl" for="date">日期</label>
        <input id="date" type="date">
      </div>
    </div>
    <div class="chips" id="tensionChips" aria-label="常用磅數"></div>
  </form>

  <details>
    <summary>最近列印</summary>
    <div class="panel"><div class="history" id="history"></div></div>
  </details>

  <details id="settings">
    <summary>設定（LOGO、濃度、方向）</summary>
    <div class="panel">
      <div class="logo-row">
        <canvas id="logoThumb" width="80" height="80"></canvas>
        <div class="field" style="flex:1">
          <label class="lbl" for="logoFile">店家 LOGO</label>
          <input id="logoFile" type="file" accept="image/*">
          <button id="logoReset" class="chip" type="button" style="justify-self:start">換回嘉友 LOGO</button>
        </div>
      </div>
      <div class="field">
        <label class="lbl" for="shopName">LOGO 下方的店名</label>
        <input id="shopName" maxlength="8">
      </div>
      <div class="field">
        <label class="lbl" for="thresh">LOGO 黑白門檻 <span id="threshVal" class="num"></span></label>
        <input id="thresh" type="range" min="40" max="230" step="5">
        <p class="hint">標籤機只印黑白。LOGO 太黑就往左拉，太淡就往右拉。</p>
      </div>
      <div class="row">
        <div class="field">
          <label class="lbl" for="density">列印濃度</label>
          <select id="density"><option value="1">1（淡）</option><option value="2">2（標準）</option><option value="3">3（深）</option></select>
        </div>
        <div class="field">
          <label class="lbl" for="dateFmt">日期格式</label>
          <select id="dateFmt"><option value="dash">2026-11-01</option><option value="slash">2026/11/01</option><option value="md">11/01</option></select>
        </div>
      </div>
      <div class="field">
        <label class="lbl" for="unit">磅數單位</label>
        <select id="unit"><option value="p">25p</option><option value=" 磅">25 磅</option><option value=" lbs">25 lbs</option></select>
      </div>
      <label class="check"><input id="logoRight" type="checkbox"> LOGO 放右邊</label>
      <label class="check"><input id="rotate" type="checkbox"> 列印方向轉 180°（印出來顛倒時勾選）</label>
      <div class="field">
        <label class="lbl" for="stringList">常用線種（用逗號分隔）</label>
        <input id="stringList">
      </div>
      <div class="field">
        <label class="lbl" for="tensionList">常用磅數（用逗號分隔）</label>
        <input id="tensionList">
      </div>
    </div>
  </details>
</div>

<div class="bar">
  <div class="bar-in">
    <button id="connect" class="btn" type="button">連線</button>
    <div class="qty" aria-label="列印張數">
      <button type="button" id="minus" aria-label="減少張數">−</button>
      <span id="qty" class="num">1</span>
      <button type="button" id="plus" aria-label="增加張數">＋</button>
    </div>
    <button id="print" class="btn primary" type="button" disabled>列印</button>
  </div>
  <p id="msg" role="status"></p>
</div>

<script src="https://unpkg.com/@mmote/niimbluelib@0.47.1/dist/umd/niimbluelib.min.js"></script>
<script>
(() => {
  const W = 176, H = 96; // 22 × 12 mm at 203 dpi (8 dots/mm)
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("sl." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("sl." + k, JSON.stringify(v)); } catch {} },
  };

  const cfg = Object.assign({
    thresh: 140, density: 2, dateFmt: "dash", unit: "p", shopName: "嘉友體育", logoRight: false, rotate: false,
    strings: ["z61", "BG65", "BG65Ti", "BG66U", "BG80", "BG80P", "AB", "NBG95", "NBG99", "EX63", "EX65"],
    tensions: ["22", "23", "24", "25", "26", "27", "28", "30"],
  }, store.get("cfg", {}));
  const saveCfg = () => store.set("cfg", cfg);
  const DEFAULT_LOGO = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAKAAAACgAQAAAACjtFqAAAAFEUlEQVR42r2XPY8kRxnHf1U9NzMnra8bEgbpRI/kgNAXWRugmzaQQ0hAsB+B0AHWFNJJpBs6XL6B+QLe5s6SN0DyBQ4uQKKMLHkDxNWtVqhvqek/QVW/zJ5DRCc9/ddTz0v9n7cx4t3H8n8H/3Y+ocpP/4Pij8PvAezXsNzdAwNgfpw/Bp3nhdtdfueODMk9xsP1kaGO1WLleP9I5zVYg+MIhLPi5XguvW4okgO/moH/YCXJVyxnLn1ebYD6d9hmsp5f7ZbdeLxnJUmKUI7HbzgFoIBuPN4ON9CmIxagLXJ4T1lPsS8yaLgZjseTerxe8/d8PJ5sBx4cIUu+qQZBecos+frNyNgPx0v2yxE8ocpgO3Fr6F3SyWhccuudhNSz08xSLVno10c5E5LOqpmgxySdt5ObUk8pWYiGufkTsBBuvk/n0eMiIP1lNdMpb1Lsm3dSWSrquWRgLwufbOGbMYA1YNEzYHs3gAsqLKwbDmiIqgAsd7dwC3608jEoIPmcGpJkvpQlm7gdBC8/w4KZn50XQtn1A7Jdg7pScrt+LD0vIV9K7MV+CGklCw5wuFHjWywXDTLQtFOcFlqwsL0a4wS1pWIh+bGerSw546pR68Khi1rdSgq5GNQvJ8lAzHzeuZG4Cw5T5srtFFcSDCnl9hPFjpfZ0AX9eqe4UjQtRZL8orZ0QCQChwqAiDUkdmwbcg3S0jd79YXCih67lyRf274FesLaGNefp8RDSDJqH6GQytfXVpsU8yPcVKT9RpJTe0odUgChzrG7tuGaLVwlNl8BTes6YngMd0CwBGD7FWenPb8AAZXtC6C6MZ/9Uo420Ug0kjoKerbqFuzV7awVsGBhjHsLlhawxgGWNa75F/wneAg2psjeE0SWOgksPBFJclt2AcntC8XaJnONhxMcXMw60pYnV5Y/Y8LkkjyhFOx8+UKxzsRtzPrfOF6lLLek0WWXEfjn5tAAySUWIAf9IhlILvVGPAWzp1SsbYEDTEpltW0Fzh6So4J+Cf5Dn75Sj91zWuJLSbG2SpLbS3zF+Vhcic2e67P2rwkasq7yAD4nTi61brM08qWRpN1gqKNEXemG2dHkLuGa7jZnIG0z3N7VOleFHd9N83bR52RVu0vdUJ7f82SfdXoAY6iwuRZGTx2BP+WmbflJbm/AdXtvajcOeJIMWaowREpcp4sY+9IW6Be5Eyuk3uXLcGL0naTX49Sm6tZWbgN47DDriAszdbB1Inndg2sBXs66t2LX3N8uFjxLdyOPhU8GPFYe6NtJ0vJ8HDeWBwP8jVJuNjM+x7nmsAzEk5I4D5QmU901VwCv7k/DbWoMlqlNJwqfA9KnZWKuCEhSISF1K0mK1nQmgxauk88PWC6BQ4p90w3UfZzGMUhdIUlxlZp690EaZ4eBeYCuAgvLe1zn3w1APGtzlLPryBPFO9Lo8Sm6o9GTLNjUUj/K4K8Dkw8ARvDmRx3wh1A60MMuSYa73OmBu5iXEz9bhcIqLyc1brzNcJoNiRaozPGqSS0pFJLkLocdzK0kxVVqG+MKF4GiA3o7HvfFOPIfTpKHYZSF5SgZx5XHlbNlr5ztKyNYDLvpV9NWOSye/sFs1ezyeM4nBjBlSQaTSw/cHcC3/GzGrEVbwOdczRa+xUgec7T9dlBqHKeZ9yXclNM6lONbAJzcW8i/NnmvmUvGF9if1vcki0vX/8bP1gYAfh5/e5Qh+TkU3wP+z/6h/BceWyr8pIFAOwAAAABJRU5ErkJggg==";

  let logoImg = null;
  let qty = 1;
  let client = null;
  let busy = false;
  const lib = window.niimbluelib;

  // ---------- label drawing ----------
  const canvas = $("label");
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  function fmtDate(v) {
    if (!v) return "";
    const [y, m, d] = v.split("-");
    if (cfg.dateFmt === "md") return `${m}/${d}`;
    return cfg.dateFmt === "slash" ? `${y}/${m}/${d}` : `${y}-${m}-${d}`;
  }

  function fitText(text, x, y, maxW, size, weight, family) {
    let s = size;
    do { ctx.font = `${weight} ${s}px ${family}`; if (ctx.measureText(text).width <= maxW) break; s -= 1; } while (s > 8);
    ctx.fillText(text, x, y);
    return s;
  }

  function threshold(c, x, y, w, h, t) {
    const img = c.getImageData(x, y, w, h), p = img.data;
    for (let i = 0; i < p.length; i += 4) {
      const a = p[i + 3] / 255;
      const lum = (0.299 * p[i] + 0.587 * p[i + 1] + 0.114 * p[i + 2]) * a + 255 * (1 - a);
      const v = lum < t ? 0 : 255;
      p[i] = p[i + 1] = p[i + 2] = v; p[i + 3] = 255;
    }
    c.putImageData(img, x, y);
  }

  function drawLogo(c, x, y, w, h) {
    if (!logoImg) return;
    const r = Math.min(w / logoImg.width, h / logoImg.height);
    const dw = Math.round(logoImg.width * r), dh = Math.round(logoImg.height * r);
    c.fillStyle = "#fff"; c.fillRect(x, y, w, h);
    c.drawImage(logoImg, x + Math.round((w - dw) / 2), y + Math.round((h - dh) / 2), dw, dh);
    threshold(c, x, y, w, h, cfg.thresh);
  }

  const LABEL_FONT = '"Barlow Condensed", "Noto Sans TC", "Noto Sans CJK TC", sans-serif';
  const CJK_FONT = '"Noto Sans TC", "Noto Sans CJK TC", sans-serif';

  // Layout follows the shop's existing label: logo + shop name on the left,
  // name / string + tension / date on the right.
  function render() {
    ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
    const leftW = 80, colGap = 8;
    const lx = cfg.logoRight ? W - leftW - 4 : 4;            // left column x
    const rx = cfg.logoRight ? 4 : 4 + leftW + colGap;       // right column x
    const rw = W - leftW - colGap - 8;                       // right column width
    const logoS = 58;
    drawLogo(ctx, lx + (leftW - logoS) / 2, 5, logoS, logoS);

    const name = $("phone").value.trim();
    const str = $("string").value.trim();
    let ten = $("tension").value.trim();
    if (ten && /^[\d./]+$/.test(ten)) ten += cfg.unit;
    const date = fmtDate($("date").value);

    ctx.fillStyle = "#000"; ctx.textBaseline = "alphabetic"; ctx.textAlign = "center";
    if (cfg.shopName) fitText(cfg.shopName, lx + leftW / 2, 84, leftW, 17, 900, CJK_FONT);
    const cx = rx + rw / 2;
    fitText(name || "---", cx, 32, rw, 24, 900, LABEL_FONT);
    fitText([str, ten].filter(Boolean).join("  "), cx, 58, rw, 23, 700, LABEL_FONT);
    fitText(date, cx, 84, rw, 19, 700, LABEL_FONT);
    ctx.textAlign = "left";
    threshold(ctx, 0, 0, W, H, 150);

    $("logoHint").hidden = !!logoImg;
    updatePrintBtn();
  }

  // Canvas only uses a web font once it is loaded, and CJK glyphs load per subset.
  let fontTimer = 0;
  function ensureFonts() {
    if (!document.fonts) return;
    clearTimeout(fontTimer);
    fontTimer = setTimeout(() => {
      const text = [$("phone").value, $("string").value, $("tension").value, cfg.shopName, cfg.unit, "0123456789-/p"].join("");
      Promise.all([
        document.fonts.load('900 24px "Noto Sans TC"', text),
        document.fonts.load('700 24px "Noto Sans TC"', text),
        document.fonts.load('900 24px "Barlow Condensed"', text),
        document.fonts.load('700 24px "Barlow Condensed"', text),
      ]).then(render, () => {});
    }, 150);
  }

  function printCanvas() {
    if (!cfg.rotate) return canvas;
    const c = document.createElement("canvas"); c.width = W; c.height = H;
    const x = c.getContext("2d");
    x.translate(W, H); x.rotate(Math.PI); x.drawImage(canvas, 0, 0);
    return c;
  }

  // ---------- form ----------
  function today() {
    const d = new Date(), p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }

  function chips(el, list, input, suffix) {
    el.innerHTML = "";
    for (const v of list) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip" + (suffix ? " num" : "");
      b.textContent = v + (suffix || "");
      b.setAttribute("aria-pressed", String(input.value.trim() === v));
      b.onclick = () => { input.value = v; onInput(); };
      el.appendChild(b);
    }
  }
  function refreshChips() {
    chips($("stringChips"), cfg.strings, $("string"));
    chips($("tensionChips"), cfg.tensions, $("tension"), cfg.unit);
  }

  function onInput() {
    store.set("draft", { string: $("string").value, tension: $("tension").value });
    refreshChips(); render(); ensureFonts();
  }

  function updatePrintBtn() {
    const ok = client && client.isConnected() && $("phone").value.trim() !== "" && !busy;
    $("print").disabled = !ok;
  }

  function setMsg(t, kind) { const m = $("msg"); m.textContent = t || ""; m.className = kind || ""; }
  function setStatus(t, kind) { const s = $("status"); s.textContent = t; s.className = "status" + (kind ? " " + kind : ""); }

  // ---------- logo ----------
  function loadLogo(dataUrl) {
    if (!dataUrl) { logoImg = null; drawThumb(); render(); return; }
    const img = new Image();
    img.onload = () => { logoImg = img; drawThumb(); render(); };
    img.src = dataUrl;
  }
  function drawThumb() {
    const t = $("logoThumb").getContext("2d");
    t.fillStyle = "#fff"; t.fillRect(0, 0, 80, 80);
    if (logoImg) drawLogo(t, 0, 0, 80, 80);
  }
  $("logoFile").addEventListener("change", (e) => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {
      // shrink to keep storage small
      const s = Math.min(1, 320 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL("image/png");
      store.set("logo", url); loadLogo(url);
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(f);
  });

  // ---------- printer ----------
  async function connect() {
    if (client && client.isConnected()) { await client.disconnect(); return; }
    try {
      setStatus("連線中…", "busy"); setMsg("請在跳出的清單中選擇 D110");
      client = new lib.NiimbotBluetoothClient();
      client.on("disconnect", () => { setStatus("未連線"); $("connect").textContent = "連線"; updatePrintBtn(); });
      const info = await client.connect();
      const model = client.getModelMetadata()?.model || info.deviceName || "標籤機";
      setStatus("已連線 " + model, "on");
      $("connect").textContent = "中斷";
      setMsg("");
    } catch (e) {
      setStatus("未連線");
      setMsg(String(e && e.message || e).includes("cancel") ? "" : "連線失敗：" + (e.message || e) + "。確認標籤機已開機、手機藍牙已開啟。", "err");
    }
    updatePrintBtn();
  }

  async function print() {
    if (!client || !client.isConnected()) return;
    busy = true; updatePrintBtn(); setMsg("列印中…");
    const meta = client.getModelMetadata();
    const dir = meta?.printDirection || "left";
    const taskName = client.getPrintTaskType() || "D110";
    const n = qty;
    let task;
    try {
      const enc = lib.ImageEncoder.encodeCanvas(printCanvas(), lib.PageColorType.SingleColor, dir);
      task = client.protocol.newPrintTask(taskName, {
        totalPages: n, density: Number(cfg.density), labelType: lib.LabelType.WithGaps,
      });
      await task.printInit();
      await task.printPage(enc, n);
      await task.waitForFinished();
      setMsg(`已列印 ${n} 張`, "ok");
      addHistory();
      $("phone").value = ""; render(); $("phone").focus();
    } catch (e) {
      setMsg("列印失敗：" + (e.message || e), "err");
    } finally {
      try { if (task) await task.printEnd(); else await client.protocol.printEnd(); } catch {}
      busy = false; updatePrintBtn();
    }
  }

  // ---------- history ----------
  function addHistory() {
    const h = store.get("history", []);
    h.unshift({ phone: $("phone").value, string: $("string").value.trim(), tension: $("tension").value.trim(), date: $("date").value });
    store.set("history", h.slice(0, 20));
    drawHistory();
  }
  function drawHistory() {
    const h = store.get("history", []), el = $("history");
    el.innerHTML = "";
    if (!h.length) { el.innerHTML = '<p class="empty">印過的標籤會出現在這裡，點「帶入」可以補印。</p>'; return; }
    h.forEach((r) => {
      const d = document.createElement("div"); d.className = "hist-item";
      const n = document.createElement("span"); n.className = "num"; n.textContent = r.phone;
      const t = document.createElement("span"); t.textContent = [r.string, r.tension && r.tension + (/^[\d./]+$/.test(r.tension) ? cfg.unit : ""), fmtDate(r.date)].filter(Boolean).join(" · ");
      const b = document.createElement("button"); b.type = "button"; b.textContent = "帶入";
      b.onclick = () => {
        $("phone").value = r.phone; $("string").value = r.string; $("tension").value = r.tension; $("date").value = r.date || today();
        onInput(); window.scrollTo({ top: 0, behavior: "smooth" });
      };
      d.append(n, t, b); el.appendChild(d);
    });
  }

  // ---------- wire up ----------
  const draft = store.get("draft", {});
  $("string").value = draft.string || "";
  $("tension").value = draft.tension || "";
  $("date").value = today();
  $("thresh").value = cfg.thresh; $("threshVal").textContent = cfg.thresh;
  $("density").value = cfg.density; $("dateFmt").value = cfg.dateFmt;
  $("logoRight").checked = cfg.logoRight; $("rotate").checked = cfg.rotate;
  $("stringList").value = cfg.strings.join(", ");
  $("tensionList").value = cfg.tensions.join(", ");

  ["phone", "string", "tension", "date"].forEach((id) => $(id).addEventListener("input", onInput));
  $("thresh").addEventListener("input", (e) => { cfg.thresh = +e.target.value; $("threshVal").textContent = cfg.thresh; saveCfg(); drawThumb(); render(); });
  $("density").addEventListener("change", (e) => { cfg.density = +e.target.value; saveCfg(); });
  $("dateFmt").addEventListener("change", (e) => { cfg.dateFmt = e.target.value; saveCfg(); render(); drawHistory(); });
  $("logoRight").addEventListener("change", (e) => { cfg.logoRight = e.target.checked; saveCfg(); render(); });
  $("shopName").value = cfg.shopName; $("unit").value = cfg.unit;
  $("shopName").addEventListener("input", (e) => { cfg.shopName = e.target.value.trim(); saveCfg(); render(); ensureFonts(); });
  $("unit").addEventListener("change", (e) => { cfg.unit = e.target.value; saveCfg(); refreshChips(); render(); drawHistory(); });
  $("logoReset").onclick = () => { try { localStorage.removeItem("sl.logo"); } catch {} loadLogo(DEFAULT_LOGO); };
  $("rotate").addEventListener("change", (e) => { cfg.rotate = e.target.checked; saveCfg(); });
  const listOf = (v) => v.split(/[,，、]/).map((s) => s.trim()).filter(Boolean);
  $("stringList").addEventListener("change", (e) => { cfg.strings = listOf(e.target.value); saveCfg(); refreshChips(); });
  $("tensionList").addEventListener("change", (e) => { cfg.tensions = listOf(e.target.value); saveCfg(); refreshChips(); });
  $("minus").onclick = () => { qty = Math.max(1, qty - 1); $("qty").textContent = qty; };
  $("plus").onclick = () => { qty = Math.min(20, qty + 1); $("qty").textContent = qty; };
  $("connect").onclick = connect;
  $("print").onclick = print;
  $("form").addEventListener("submit", (e) => { e.preventDefault(); if (!$("print").disabled) print(); });

  if (!navigator.bluetooth || !lib) { $("noBt").hidden = false; $("connect").disabled = true; }

  refreshChips(); drawHistory();
  loadLogo(store.get("logo", DEFAULT_LOGO));
  render(); ensureFonts();
})();
</script>
</body>
</html>
